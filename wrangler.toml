# Wrangler configuration for CLEVER Dashboard
name = "clever-dashboard-test"
main = "packages/backend/dist/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
account_id = "98dfed939a59dca09770880eab939b79"

# Environment variables for test (default)
[vars]
NODE_ENV = "test"
LOG_LEVEL = "debug"
CLERK_PUBLISHABLE_KEY = "pk_test_c3RhYmxlLWJ1Y2stNTUuY2xlcmsuYWNjb3VudHMuZGV2JA"
# CLERK_SECRET_KEY is set via wrangler secret put

# Static assets binding
[assets]
directory = "packages/frontend/dist"
binding = "ASSETS"

# R2 bucket for test environment
[[r2_buckets]]
binding = "CONTENT"
bucket_name = "clever-content-test"

# Development configuration
[dev]
port = 8787
local_protocol = "http"
upstream_protocol = "https"

# Performance limits
[limits]
cpu_ms = 50

# Production environment (deployed)
[env.production]
name = "clever-dashboard-prod"

[env.production.vars]
NODE_ENV = "production"
LOG_LEVEL = "warn"
CLERK_PUBLISHABLE_KEY = "pk_live_your_publishable_key_here"
# CLERK_SECRET_KEY is set via wrangler secret put

[[env.production.r2_buckets]]
binding = "CONTENT"
bucket_name = "clever-content-prod"